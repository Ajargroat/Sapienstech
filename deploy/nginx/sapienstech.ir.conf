# sapienstech.ir — corporate site (static page + lead-capture endpoint).
#
# Deliberately separate from the Laravel vhost: this host must not fall through
# to public/index.php. IdentifyTenant resolves the Host against the `domains`
# table, and the apex no longer belongs to a tenant, so the framework would
# answer 404 (or, worse, keep serving the tenant that used to own it).
#
# The corporate page, its logo, its font and api.php are plain files under
# /var/www/sapienstech/corporate-site. Relative URLs inside index.html
# (`fonts/…`, `api.php`, the logo filename) only resolve because that folder is
# the web root.
#
# Install — this server already has a vhost at
# /etc/nginx/sites-available/sapienstech (enabled via sites-enabled/):
#
#   sudo cp /etc/nginx/sites-available/sapienstech /root/nginx-sapienstech.ir.bak
#   sudo cp deploy/nginx/sapienstech.ir.conf /etc/nginx/sites-available/sapienstech
#   sudo grep -nE "root|server_name" /etc/nginx/sites-available/sapienstech
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do NOT add a second file for the same server_name — nginx keeps the first
# block and only logs "conflicting server name". On a host with no vhost yet,
# the same file can be installed as sites-available/sapienstech.ir plus a
# symlink in sites-enabled/.
#
# Then issue the certificate; certbot rewrites this file in place, adding the
# 443 blocks and the HTTP→HTTPS redirect:
#   sudo certbot --nginx -d sapienstech.ir -d www.sapienstech.ir --redirect
#
# Check the PHP-FPM socket version first: `ls /run/php/`.

server {
    listen 80;
    listen [::]:80;
    server_name sapienstech.ir www.sapienstech.ir;

    root /var/www/sapienstech/corporate-site;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    # Page, logo and font are ordinary files; anything else is a 404, not a
    # framework route.
    location / {
        try_files $uri $uri/ =404;
    }

    # Lead form endpoint (corporate-site/api.php).
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~* \.(?:png|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # No dotfiles, no editor backups.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
